<div class="clientes-list-container">
  <header class="page-header">
    <div class="title-section">
      <h1>Gestión de Clientes</h1>
      <p>Administre la información de sus clientes, direcciones y contactos</p>
    </div>
    <button class="btn-primary" routerLink="nuevo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Nuevo Cliente
    </button>
  </header>

  <app-alert
    [visible]="showAlert()"
    [type]="alertType()"
    [title]="alertTitle()"
    [message]="alertMessage()"
    (closed)="showAlert.set(false)"
  ></app-alert>

  <div class="content-card">
    <div class="table-actions">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          placeholder="Buscar por nombre o CI..." 
          [(ngModel)]="searchText"
          (keyup.enter)="onSearch()"
        />
      </div>
      <button class="btn-secondary" (click)="onSearch()">Buscar</button>
    </div>

    <div class="table-responsive">
      <div *ngIf="isLoading()" class="loading-overlay">
        <div class="spinner"></div>
      </div>

      <table class="premium-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre / Razón Social</th>
            <th>CI / NIT</th>
            <th>Correo Electrónico</th>
            <th>Teléfono</th>
            <th>Tipo</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of clientes()">
            <td><span class="code-badge">{{ c.id }}</span></td>
            <td><strong>{{ c.nombre }}</strong></td>
            <td>{{ c.ci }}</td>
            <td>{{ c.correo_electronico }}</td>
            <td>{{ c.telefono }}</td>
            <td>{{ c.tipo }}</td>
            <td class="actions-cell">
              <button class="btn-icon" [routerLink]="['editar', c.id]" title="Editar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
              </button>
              <button class="btn-icon delete" (click)="deleteCliente(c.id)" title="Eliminar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </td>
          </tr>
          <tr *ngIf="clientes().length === 0 && !isLoading()">
            <td colspan="6" class="empty-state">
              No se encontraron clientes registrados.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
